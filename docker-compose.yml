version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: x402-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: x402user
      POSTGRES_PASSWORD: x402password
      POSTGRES_DB: x402observatory
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U x402user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: x402-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: x402-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://x402user:x402password@postgres:5432/x402observatory
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./exports:/app/exports

  # Base Collector Service
  collector-base:
    build:
      context: .
      dockerfile: Dockerfile.collector
      args:
        CHAIN: base
    container_name: x402-collector-base
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://x402user:x402password@postgres:5432/x402observatory
      REDIS_URL: redis://redis:6379
      CHAIN: base
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Solana Collector Service
  collector-solana:
    build:
      context: .
      dockerfile: Dockerfile.collector
      args:
        CHAIN: solana
    container_name: x402-collector-solana
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://x402user:x402password@postgres:5432/x402observatory
      REDIS_URL: redis://redis:6379
      CHAIN: solana
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
